name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    steps:
      - parallel:
          - name: Checkout repository
            uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            with:
              persist-credentials: false
          - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
            with:
              toolchain: stable
              components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: cargo check
        run: cargo check --workspace --features ssr

  test:
    name: cargo test
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    steps:
      - parallel:
          - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            with:
              persist-credentials: false
          - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
            with:
              toolchain: stable
              components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: cargo test
        run: cargo test --workspace --features ssr

  lint-ssr:
    name: clippy (ssr)
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    steps:
      - parallel:
          - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            with:
              persist-credentials: false
          - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
            with:
              toolchain: stable
              components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: cargo clippy (ssr)
        run: cargo clippy --workspace --features ssr -- -D warnings

  lint-hydrate:
    name: clippy (hydrate)
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    steps:
      - parallel:
          - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            with:
              persist-credentials: false
          # The hydrate side compiles to wasm32; needs that target installed.
          - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
            with:
              toolchain: stable
              components: clippy, rustfmt
              targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: cargo clippy (hydrate)
        run: cargo clippy -p roder --no-default-features --features hydrate -- -D warnings

  helm:
    name: helm lint
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - parallel:
          - name: helm lint
            run: helm lint helm
          - name: helm template (render + schema check)
            run: helm template roder helm >/dev/null
