# roder keeps per-user informer caches in-process, so each replica opens its own
# set of watches against the API server. Running ONE replica keeps one watch per
# active (user, resource) on etcd — raising this duplicates those watches across
# replicas. Multiple replicas enable off-target node power operations and are
# automatically spread across nodes; set a stable RODER_SESSION_KEY shared by all.
replicaCount: 1

image:
  repository: ghcr.io/krezh/roder
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion when empty.
  tag: ""
  # Pins the image by digest (sha256:...), overriding tag; the release
  # pipeline fills it with the published image's digest.
  digest: ""

# Image used for ephemeral pod debugging and privileged node shells. It must
# remain pinned by digest because node shells run with host-level access.
debugImage: "docker.io/nicolaka/netshoot@sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70"

serviceAccount:
  create: true
  annotations: {}
  name: ""

# Native Talos in-cluster API access. The cluster machine configuration must
# enable `machine.features.kubernetesTalosAPIAccess` for this namespace and
# permit whatever roles are listed below. Talos reconciles the custom
# ServiceAccount below into a short-lived client configuration; no
# external/admin talosconfig is used.
talos:
  enabled: false
  # Empty permits any authenticated Roder user to read Talos status. Set this
  # to one or more OIDC groups to restrict machine status and kernel logs.
  readerGroups: []
  actions:
    # Mutations are disabled unless this is true and the user belongs to one of
    # operatorGroups. This only gates roder's own authorization check — the
    # Talos ServiceAccount still needs a role capable of mutating actions (Talos
    # has no role between os:reader and os:admin, so add os:admin to `roles`
    # below).
    enabled: false
    operatorGroups: []
  config:
    # Machine configuration fingerprints and redacted diffs require the
    # ServiceAccount to hold os:admin (add it to `roles` below) as well as
    # roder's own authorization check to be enabled here.
    enabled: false
    readerGroups: []
  # The Talos ServiceAccount role(s) roder's ServiceAccount requests — this is
  # the single knob controlling what roder can actually do against Talos. Must
  # be set explicitly; e.g. os:reader for read-only, os:operator or os:admin
  roles: []

# Alertmanager alerts panel (cluster-wide alerts, fetched by roder's SA).
alertmanager:
  # In-cluster Alertmanager URL — sets RODER_ALERTMANAGER_URL. Empty disables
  # the panel. Example:
  #   http://alertmanager-operated.monitoring.svc.cluster.local:9093
  url: ""
  # Who may read Alertmanager alerts. Empty = any authenticated user. Enforced
  # by roder via RODER_ALERTS_GROUPS. Restrict this if cluster-wide alert text
  # (namespaces/pods a tenant can't otherwise see) should not be visible to all.
  readerGroups: []

# Per-user backend registry tuning (multi-user token passthrough). Both have
# sensible in-app defaults; override only if needed.
backends:
  # Max concurrent per-user backends before the soft LRU cap evicts idle ones.
  # The cap never rejects a user; it bounds resident memory + API-server streams.
  maxUserBackends: 200
  # Idle seconds before a user's backend with no active streams is reaped.
  backendIdleSecs: 1200

# ClusterRole + binding for roder's ServiceAccount. Grants API discovery and
# read/watch on CRDs (to harvest additionalPrinterColumns up front), plus the
# shared, cluster-wide enrichment reads roder performs as this ServiceAccount:
# pod metrics (metrics.k8s.io/pods) and node listing + kubelet stats (nodes,
# nodes/proxy) for PVC usage. All per-user OBJECT data is still read with each
# user's passthrough OIDC token, never this ServiceAccount. Disable if you
# manage RBAC yourself.
rbac:
  create: true

# Name of the Secret holding the sensitive env vars — at least
# RODER_OIDC_CLIENT_SECRET and RODER_SESSION_KEY (a stable 32-byte key, hex or
# base64, that seals the session cookie; sessions are stateless and survive a
# restart only if this key is set and unchanged across instances).
# Backward-compatible shortcut: prepended to `envFrom` as a `secretRef`.
# For additional sources (configMap refs, multiple secrets), use `envFrom` below.
existingSecret: ""

# Environment variables from Secrets and/or ConfigMaps. Each entry is one of:
#   - secretRef:     { name: <secret> }
#   - configMapRef:  { name: <configmap> }
# Multiple sources are supported. `existingSecret` (if set) is prepended as a
# `secretRef`. Use this for sensitive values (RODER_OIDC_CLIENT_SECRET, etc.).
# Example:
#   envFrom:
#     - configMapRef:
#         name: roder-config
envFrom: []

# Additional, non-sensitive environment variables. Each entry is a
# `{name, value}` pair. The roder app reads its own env — at minimum set
# RODER_BASE_URL, RODER_OIDC_ISSUER_URL, RODER_OIDC_CLIENT_ID, and (optionally) RODER_OIDC_ALLOWED_GROUPS.
# Example:
#   env:
#     - name: RODER_BASE_URL
#       value: "https://roder.example.com"
#     - name: RODER_OIDC_ISSUER_URL
#       value: "https://accounts.google.com"
#     - name: RODER_OIDC_CLIENT_ID
#       value: "abc.apps.googleusercontent.com"
#     - name: RODER_OIDC_ALLOWED_GROUPS
#       value: "admins,developers"   # Comma-separated; empty = any authenticated user
env: []

podAnnotations: {}
podLabels: {}

# Pod- and container-level hardening. Defaults satisfy the Pod Security
# Standards "restricted" profile (non-root, no privilege escalation, all
# capabilities dropped, RuntimeDefault seccomp, read-only root filesystem).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 8080
  # Keeps a browser/gateway source on one replica, avoiding concurrent OIDC
  # refresh-token rotation across otherwise independent backend caches.
  sessionAffinity: ClientIP

# Gateway API HTTPRoute. Disabled by default.
httpRoute:
  enabled: false
  parentRefs:
    - name: gateway
      namespace: gateway-system
  hostnames:
    - roder.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 1
  periodSeconds: 5

strategy:
  type: RollingUpdate
  rollingUpdate:
    # Allows a hard anti-affinity replica to move on clusters with exactly N nodes.
    # For one replica this rounds down to zero, preserving availability.
    maxUnavailable: 50%
    maxSurge: 1

nodeSelector: {}
affinity: {}
tolerations: []
