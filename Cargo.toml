[workspace]
resolver = "3"
members = ["crates/core", "crates/k8s", "crates/auth", "crates/talos"]

# Shared by the workspace member crates (roder-core, roder-k8s, roder-auth).
# Each member inlines its own `version` so release-please can rewrite it
# directly; the roder root package also has its own inline `version` below.
[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/krezh/roder"
rust-version = "1.96"

[workspace.dependencies]
roder-core = { path = "crates/core" }
roder-k8s = { path = "crates/k8s" }
roder-auth = { path = "crates/auth" }
roder-talos = { path = "crates/talos" }

# Frontend / SSR
leptos = "0.8"
leptos_axum = "0.8"
leptos_meta = "0.8"
leptos_router = "0.8"

# Server
axum = "0.8"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "signal",
] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "trace", "compression-br"] }

# Wasm
wasm-bindgen = "0.2.125"
console_error_panic_hook = "0.1"
send_wrapper = "0.6"

# Shared
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Upstream fix for Rust E0365 future-incompatibility warning. Remove once a
# proc-macro-error2 release includes https://github.com/GnomedDev/proc-macro-error-2/pull/14.
[patch.crates-io]
proc-macro-error2 = { git = "https://github.com/fgardt/proc-macro-error-2", rev = "53ff94b61c678593158db1a3d50269c6f0de0db7" }

[package]
name = "roder"
version = "0.1.22"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "roder"
path = "src/main.rs"

[dependencies]
roder-core = { workspace = true }
roder-k8s = { workspace = true, optional = true }
roder-auth = { workspace = true, optional = true }
roder-talos = { workspace = true, optional = true }

leptos = { workspace = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
leptos_axum = { workspace = true, optional = true }
axum = { workspace = true, optional = true, features = ["ws"] }
tokio = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = "0.22"
rand = { version = "0.10", optional = true }
aes-gcm = { version = "0.11", optional = true }
time = { version = "0.3", optional = true }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
], optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
futures = { version = "0.3", optional = true }

# hydrate (wasm) only
send_wrapper = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
gloo-net = { version = "0.7", default-features = false, features = [
  "http",
  "json",
], optional = true }
web-sys = { version = "0.3", features = [
  "EventSource",
  "MessageEvent",
  "Window",
  "Navigator",
  "Clipboard",
  "Storage",
  "Document",
  "Element",
  "EventTarget",
  "TransitionEvent",
  "DomRect",
  "MediaQueryList",
  "MediaQueryListEvent",
  "CssStyleDeclaration",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "TextMetrics",
], optional = true }

# Native (server) binary only — target-gated out of the wasm/hydrate build, and
# behind the off-by-default `jemalloc` feature so it isn't pulled in for local
# `cargo leptos watch` / clippy. tikv-jemalloc-sys builds jemalloc from C source,
# which doesn't compile on a NixOS host; the production image (full glibc
# toolchain) enables it via `cargo leptos build --bin-features ssr,jemalloc`.
# jemalloc cuts RSS and fragmentation dramatically versus glibc malloc for
# roder's long-lived, watch-heavy allocation pattern, and (with the decay tuning
# in `_RJEM_MALLOC_CONF`, see Dockerfile) returns freed pages to the OS promptly
# after a relist spike instead of holding them as resident.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tikv-jemallocator = { version = "0.7", optional = true }

[dev-dependencies]
time = "0.3"
serial_test = "3"

[features]
default = ["ssr"]
hydrate = [
  "leptos/hydrate",
  "dep:send_wrapper",
  "dep:console_error_panic_hook",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:js-sys",
  "dep:gloo-net",
  "dep:web-sys",
]
ssr = [
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
  "dep:leptos_axum",
  "dep:axum",
  "dep:tokio",
  "dep:tower",
  "dep:tower-http",
  "dep:tracing",
  "dep:tracing-subscriber",
  "dep:roder-k8s",
  "dep:roder-auth",
  "dep:roder-talos",
  "dep:rand",
  "dep:rustls",
  "dep:tokio-stream",
  "dep:futures",
  "dep:aes-gcm",
  "dep:time",
]
# Use jemalloc for the server allocator. Off by default
# enabled only in the production
# image via `cargo leptos build --bin-features ssr,jemalloc`.
jemalloc = ["dep:tikv-jemallocator"]

[package.metadata.leptos]
output-name = "roder"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.scss"
assets-dir = "public"
site-addr = "0.0.0.0:8080"
reload-port = 8081
browserquery = "defaults"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
js-minify = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"

# wasm release: optimize for size
[profile.wasm-release]
inherits = "release"
opt-level = "z"
