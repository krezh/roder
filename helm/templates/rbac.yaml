{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "roder.fullname" . }}
  labels:
    {{- include "roder.labels" . | nindent 4 }}
rules:
  # Discover the API surface (which kinds exist) at startup.
  - nonResourceURLs: ["/apis", "/apis/*", "/api", "/api/*"]
    verbs: ["get"]
  # Read CRDs to harvest additionalPrinterColumns once at startup and watch for
  # changes. Cluster *metadata* only.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  # Shared enrichment read by THIS ServiceAccount, not the user's token: a
  # single cluster-wide scrape shared across all users (so it cannot be
  # per-user). User object data — list/get/watch, mutations, exec, logs — is
  # still read ONLY with each user's passthrough OIDC token.
  #   pod CPU/memory from metrics-server (the pod-list CPU/MEM columns):
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  #   PVC %-used: list nodes, then proxy to each kubelet's /stats/summary:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "roder.fullname" . }}
  labels:
    {{- include "roder.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "roder.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "roder.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
