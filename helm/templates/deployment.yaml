apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "roder.fullname" . }}
  labels:
    {{- include "roder.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "roder.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "roder.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "roder.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: roder
          image: {{ include "roder.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: LEPTOS_SITE_ADDR
              value: "0.0.0.0:8080"
            - name: RODER_POD_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- if .Values.talos.enabled }}
            - name: RODER_TALOS_READER_GROUPS
              value: {{ toJson .Values.talos.readerGroups | quote }}
            - name: RODER_TALOS_ACTIONS_ENABLED
              value: {{ .Values.talos.actions.enabled | quote }}
            - name: RODER_TALOS_OPERATOR_GROUPS
              value: {{ toJson .Values.talos.actions.operatorGroups | quote }}
            - name: RODER_TALOS_CONFIG_ENABLED
              value: {{ .Values.talos.config.enabled | quote }}
            - name: RODER_TALOS_CONFIG_GROUPS
              value: {{ toJson .Values.talos.config.readerGroups | quote }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- $sources := .Values.envFrom }}
          {{- if .Values.existingSecret }}
          {{-   $sources = prepend $sources (dict "secretRef" (dict "name" .Values.existingSecret)) }}
          {{- end }}
          {{- with $sources }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.talos.enabled }}
            - name: talos-config
              mountPath: /var/run/secrets/talos.dev
              readOnly: true
            {{- end }}
      volumes:
        # readOnlyRootFilesystem is on; give the process a writable /tmp.
        - name: tmp
          emptyDir: {}
        {{- if .Values.talos.enabled }}
        - name: talos-config
          secret:
            secretName: {{ include "roder.fullname" . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
