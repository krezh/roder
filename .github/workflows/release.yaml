name: Release

on:
  release:
    types: [published]

jobs:
  release:
    name: Build & push container image
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Resolve wasm-bindgen version
        id: wb
        run: |
          WB_VERSION=$(grep -E '^wasm-bindgen[[:space:]]*=[[:space:]]*"=' Cargo.toml \
            | sed -E 's/.*"=([0-9.]+)".*/\1/')
          echo "value=${WB_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: WB_VERSION=${{ steps.wb.outputs.value }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/roder:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/roder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.created=${{ github.event.release.published_at }}
            org.opencontainers.image.title=roder
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.event.repository.html_url }}

      - name: Push Helm Chart to GHCR
        uses: appany/helm-oci-chart-releaser@d94988c92bed2e09c6113981f15f8bb495d10943 # v0.5.0
        with:
          name: roder
          repository: ${{ github.repository_owner }}/charts
          tag: ${{ github.event.release.tag_name }}
          path: helm
          registry: ghcr.io
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}
          update_dependencies: true

      - name: Update Release with Helm Chart Info
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          append_body: true
          body: |

            ## Helm Chart

            ```bash
            helm install roder oci://ghcr.io/${{ github.repository_owner }}/charts/roder --version ${{ github.event.release.tag_name }}
            ```

            ## Container Image

            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/roder:${{ github.event.release.tag_name }}
            ```
