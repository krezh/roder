[package]
name = "roder-k8s"
version = "0.1.33"
edition.workspace = true
license.workspace = true
repository.workspace = true

# Server-only crate: the kube-rs client (token-passthrough), and later the
# discovery + informer/Store registry and action executors. Never compiled to wasm.

[dependencies]
roder-core = { workspace = true }
kube = { version = "4.0", features = ["runtime", "derive", "ws"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
arc-swap = "1"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Faster (SIMD) JSON parsing for the large, hot metrics / kubelet-stats reads —
# serde-compatible, so it deserializes into the same typed structs.
sonic-rs = "0.5"
serde_yaml = "0.9"
futures = "0.3"
base64 = "0.22"
flate2 = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
thiserror = { workspace = true }
tracing = { workspace = true }
