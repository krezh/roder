apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "roder.fullname" . }}
  labels:
    {{- include "roder.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "roder.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "roder.selectorLabels" . | nindent 8 }}
        roder.io/ha-protocol: "2"
        {{- with .Values.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "roder.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: roder
          image: {{ include "roder.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: peer-tls
              containerPort: {{ .Values.ha.peerPort }}
              protocol: TCP
          env:
            - name: LEPTOS_SITE_ADDR
              value: "0.0.0.0:8080"
            - name: RODER_POD_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: RODER_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RODER_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: RODER_HA_ENABLED
              value: {{ gt (int .Values.replicaCount) 1 | quote }}
            - name: RODER_PEER_PORT
              value: {{ .Values.ha.peerPort | quote }}
            - name: RODER_POD_LABEL_SELECTOR
              value: {{ printf "app.kubernetes.io/name=%s,app.kubernetes.io/instance=%s,roder.io/ha-protocol=2" (include "roder.name" .) .Release.Name | quote }}
            - name: RODER_HA_SCOPE
              value: {{ printf "%s/%s" .Release.Namespace .Release.Name | quote }}
            {{- if .Values.talos.enabled }}
            - name: RODER_TALOS_READER_GROUPS
              value: {{ toJson .Values.talos.readerGroups | quote }}
            - name: RODER_TALOS_ACTIONS_ENABLED
              value: {{ .Values.talos.actions.enabled | quote }}
            - name: RODER_TALOS_OPERATOR_GROUPS
              value: {{ toJson .Values.talos.actions.operatorGroups | quote }}
            - name: RODER_TALOS_CONFIG_ENABLED
              value: {{ .Values.talos.config.enabled | quote }}
            - name: RODER_TALOS_CONFIG_GROUPS
              value: {{ toJson .Values.talos.config.readerGroups | quote }}
            {{- end }}
            {{- with .Values.alertmanager.url }}
            - name: RODER_ALERTMANAGER_URL
              value: {{ . | quote }}
            {{- end }}
            - name: RODER_ALERTS_GROUPS
              value: {{ toJson .Values.alertmanager.readerGroups | quote }}
            - name: RODER_MAX_USER_BACKENDS
              value: {{ .Values.backends.maxUserBackends | quote }}
            - name: RODER_BACKEND_IDLE_SECS
              value: {{ .Values.backends.backendIdleSecs | quote }}
            - name: RODER_DEBUG_IMAGE
              value: {{ .Values.debugImage | quote }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- $sources := .Values.envFrom }}
          {{- if .Values.existingSecret }}
          {{-   $sources = prepend $sources (dict "secretRef" (dict "name" .Values.existingSecret)) }}
          {{- end }}
          {{- with $sources }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.talos.enabled }}
            - name: talos-config
              mountPath: /var/run/secrets/talos.dev
              readOnly: true
            {{- end }}
      volumes:
        # readOnlyRootFilesystem is on; give the process a writable /tmp.
        - name: tmp
          emptyDir: {}
        {{- if .Values.talos.enabled }}
        - name: talos-config
          secret:
            secretName: {{ include "roder.fullname" . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      {{- if gt (int .Values.replicaCount) 1 }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "roder.selectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
