# roder is a single-user, in-cluster GUI. It keeps a per-pod informer cache, so
# each replica opens its own set of watches against the API server. Running ONE
# replica keeps exactly one watch per active resource type on etcd — raising this
# duplicates those watches and is rarely what you want for a personal tool.
replicaCount: 1

image:
  repository: ghcr.io/krezh/roder
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion when empty.
  tag: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# Name of the Secret holding the sensitive env vars — at least
# RODER_OIDC_CLIENT_SECRET and RODER_SESSION_KEY (a stable 32-byte key, hex or
# base64, that seals the session cookie; sessions are stateless and survive a
# restart only if this key is set and unchanged across instances).
# Backward-compatible shortcut: prepended to `envFrom` as a `secretRef`.
# For additional sources (configMap refs, multiple secrets), use `envFrom` below.
existingSecret: ""

# Environment variables from Secrets and/or ConfigMaps. Each entry is one of:
#   - secretRef:     { name: <secret> }
#   - configMapRef:  { name: <configmap> }
# Multiple sources are supported. `existingSecret` (if set) is prepended as a
# `secretRef`. Use this for sensitive values (RODER_OIDC_CLIENT_SECRET, etc.).
# Example:
#   envFrom:
#     - configMapRef:
#         name: roder-config
envFrom: []

# Additional, non-sensitive environment variables. Each entry is a
# `{name, value}` pair. The roder app reads its own env — at minimum set
# RODER_BASE_URL, RODER_OIDC_ISSUER_URL, RODER_OIDC_CLIENT_ID, and (optionally) RODER_OIDC_ALLOWED_GROUPS.
# Example:
#   env:
#     - name: RODER_BASE_URL
#       value: "https://roder.example.com"
#     - name: RODER_OIDC_ISSUER_URL
#       value: "https://accounts.google.com"
#     - name: RODER_OIDC_CLIENT_ID
#       value: "abc.apps.googleusercontent.com"
#     - name: RODER_OIDC_ALLOWED_GROUPS
#       value: "admins,developers"   # Comma-separated; empty = any authenticated user
env: []

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080

# Gateway API HTTPRoute. Disabled by default.
httpRoute:
  enabled: false
  parentRefs:
    - name: gateway
      namespace: gateway-system
  hostnames:
    - roder.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources:
  limits:
    memory: 400Mi
  requests:
    cpu: 50m
    memory: 400Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 1
  periodSeconds: 5

nodeSelector: {}
affinity: {}
tolerations: []
