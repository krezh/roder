name: Release

on:
  release:
    types: [published]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & push container image
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Resolve wasm-bindgen version
        id: wb
        run: |
          WB_VERSION="$(yq -e '.workspace.dependencies.wasm-bindgen' Cargo.toml)"
          test -n "${WB_VERSION}"
          [ "${WB_VERSION}" != "null" ]
          echo "value=${WB_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Cache Docker build mounts
        id: cache-mounts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache-mount
          key: buildkit-cargo-${{ runner.os }}-${{ github.sha }}
          restore-keys: buildkit-cargo-${{ runner.os }}-

      - name: Restore Docker build mounts
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-map: |
            {
              "cache-mount/cargo-registry": "/usr/local/cargo/registry",
              "cache-mount/target": "/app/target"
            }
          skip-extraction: ${{ steps.cache-mounts.outputs.cache-hit }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: WB_VERSION=${{ steps.wb.outputs.value }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/roder:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/roder:latest
          cache-from: type=gha,scope=roder-release
          cache-to: type=gha,scope=roder-release,mode=max
          labels: |
            org.opencontainers.image.created=${{ github.event.release.published_at }}
            org.opencontainers.image.title=roder
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.event.repository.html_url }}

      - name: Pin the released image digest into the chart
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [ -n "${DIGEST}" ] || { echo "::error::empty image digest from build step"; exit 1; }
          yq -i '.image.digest = strenv(DIGEST)' helm/values.yaml

      - name: Push Helm Chart to GHCR
        uses: appany/helm-oci-chart-releaser@d94988c92bed2e09c6113981f15f8bb495d10943 # v0.5.0
        with:
          name: roder
          repository: ${{ github.repository_owner }}/charts
          tag: ${{ github.event.release.tag_name }}
          path: helm
          registry: ghcr.io
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}
          update_dependencies: false

      - name: Update Release with Helm Chart Info
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          append_body: true
          body: |

            ## Helm Chart

            ```bash
            helm install roder oci://ghcr.io/${{ github.repository_owner }}/charts/roder --version ${{ github.event.release.tag_name }}
            ```

            ## Container Image

            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/roder:${{ github.event.release.tag_name }}
            ```
