<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/terminal/xterm.css" />
    <script src="/terminal/xterm.js"></script>
    <script src="/terminal/xterm-addon-fit.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #0d1117;
        overflow: hidden;
      }
      #t {
        width: 100%;
        height: 100%;
        padding: 4px;
      }
    </style>
  </head>
  <body>
    <div id="t"></div>
    <script>
      const p = new URLSearchParams(location.search);
      const term = new Terminal({
        cursorBlink: true,
        fontSize: 13,
        fontFamily: '"Cascadia Code","Fira Code",monospace',
        theme: {
          background: "#0d1117",
          foreground: "#e6edf3",
          cursor: "#e6edf3",
        },
      });
      const fit = new FitAddon.FitAddon();
      term.loadAddon(fit);
      term.open(document.getElementById("t"));
      fit.fit();
      term.focus();

      const proto = location.protocol === "https:" ? "wss" : "ws";
      const ns = encodeURIComponent(p.get("namespace") ?? "");
      const pod = encodeURIComponent(p.get("pod") ?? "");
      const ctr = encodeURIComponent(p.get("container") ?? "");
      const nodeShell = p.get("node_shell") === "true" ? "true" : "false";
      const ws = new WebSocket(
        `${proto}://${location.host}/api/exec?namespace=${ns}&pod=${pod}&container=${ctr}&node_shell=${nodeShell}`,
      );
      ws.binaryType = "arraybuffer";

      const sendResize = () => {
        if (ws.readyState === WebSocket.OPEN)
          ws.send(
            JSON.stringify({
              type: "resize",
              rows: term.rows,
              cols: term.cols,
            }),
          );
      };

      let openTime = 0;
      let dataReceived = false;

      ws.onopen = () => {
        openTime = Date.now();
        sendResize();
      };
      ws.onmessage = (e) => {
        dataReceived = true;
        term.write(new Uint8Array(e.data));
      };
      ws.onclose = () => {
        if (!dataReceived && Date.now() - openTime < 3000) {
          term.write(
            "\r\n\x1b[33m[No shell found in this container]\x1b[0m\r\n",
          );
          term.write(
            "\x1b[2m[The container may not have /bin/sh — try a debug image or ephemeral container.]\x1b[0m\r\n",
          );
        } else {
          term.write("\r\n\x1b[31m[disconnected]\x1b[0m\r\n");
        }
      };
      ws.onerror = () =>
        term.write("\r\n\x1b[31m[connection error]\x1b[0m\r\n");

      term.onData((data) => {
        if (ws.readyState === WebSocket.OPEN)
          ws.send(new TextEncoder().encode(data));
      });

      window.addEventListener("resize", () => {
        fit.fit();
        sendResize();
      });
    </script>
  </body>
</html>
