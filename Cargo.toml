[workspace]
resolver = "2"
members = ["crates/core", "crates/k8s", "crates/auth", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/krezh/roder"
rust-version = "1.82"

[workspace.dependencies]
roder-core = { path = "crates/core" }
roder-k8s = { path = "crates/k8s" }
roder-auth = { path = "crates/auth" }

# Frontend / SSR
leptos = "0.8"
leptos_axum = "0.8"
leptos_meta = "0.8"
leptos_router = "0.8"

# Server
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "compression-br"] }

# Wasm
wasm-bindgen = "=0.2.122"
console_error_panic_hook = "0.1"

# Shared
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"

# wasm release: optimize for size
[profile.wasm-release]
inherits = "release"
opt-level = "z"
