[package]
name = "roder-k8s"
version = "0.1.16"
edition.workspace = true
license.workspace = true
repository.workspace = true

# Server-only crate: the kube-rs client (token-passthrough), and later the
# discovery + informer/Store registry and action executors. Never compiled to wasm.

[dependencies]
roder-core = { workspace = true }
kube = { version = "3.1", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.27", features = ["latest"] }
http = "1"
arc-swap = "1"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Faster (SIMD) JSON parsing for the large, hot metrics / kubelet-stats reads —
# serde-compatible, so it deserializes into the same typed structs.
sonic-rs = "0.5"
serde_yaml = "0.9"
futures = "0.3"
time = { version = "0.3", features = ["formatting", "parsing"] }
thiserror = { workspace = true }
tracing = { workspace = true }
